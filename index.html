<title>Bitva dopamínů</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: jedna aréna uprostřed — dva bojovníci proti sobě, nad nimi jmenovky a životy, pod nimi nápověda. */
  :root {
    --sky-top: #1b1446;
    --sky-bottom: #3a2a7a;
    --floor: #2a1f5c;
    --ink: #fff7e8;
    --muted: #c9bff2;
    --good: #ffd23f;
    --good-deep: #f29f05;
    --good-skin: #ffe68a;
    --evil: #8a2be2;
    --evil-deep: #4b0f86;
    --evil-skin: #b46cf0;
    --hp-good: #3ddc84;
    --hp-evil: #ff4d6d;
    --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(var(--sky-top), var(--sky-bottom) 60%, var(--floor));
    background-color: var(--sky-top);
    color: var(--ink);
    font-family: var(--font-body);
    overflow-x: hidden;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding-block: 20px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2rem, 8vw, 3.6rem);
    line-height: 1;
    margin: 0;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }
  h1 .g { color: var(--good); }
  h1 .e { color: var(--evil-skin); }
  .sub { margin: 0; color: var(--muted); font-weight: 600; font-size: 1.05rem; max-width: 34ch; }

  .arena {
    position: relative;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(8px, 4vw, 48px);
    align-items: end;
    padding-block: 10px 0;
  }
  .stars { position: absolute; inset: 0 0 30% 0; pointer-events: none; }
  .stars i {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: var(--ink); opacity: .6; animation: twinkle 2.4s infinite ease-in-out;
  }

  .corner { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .tag {
    font-family: var(--font-display);
    font-size: clamp(1rem, 4.4vw, 1.6rem);
    padding: 4px 14px;
    border-radius: 999px;
    color: #241a4d;
    transition: background .3s, color .3s;
    white-space: nowrap;
  }
  .corner.good .tag { background: var(--good); }
  .corner.evil .tag { background: var(--evil); color: var(--ink); }

  .hp { width: min(100%, 200px); height: 14px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; }
  .hp b { display: block; height: 100%; width: 100%; border-radius: inherit; transition: width .25s ease-out, background .3s; }
  .corner.good .hp b { background: var(--hp-good); }
  .corner.evil .hp b { background: var(--hp-evil); }

  .fighter {
    appearance: none; border: 0; background: none; padding: 0; margin: 0;
    width: min(100%, 260px);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    border-radius: 24px;
  }
  .fighter:focus-visible { outline: 4px dashed var(--ink); outline-offset: 6px; }
  .mover { display: block; transition: transform .18s ease-out; }
  .bob { display: block; animation: bob 1.1s infinite ease-in-out; }
  .corner.right .bob { animation-delay: -.55s; }
  .flip { display: block; }
  .corner.right .flip { transform: scaleX(-1); }
  .corner.right .lbl { transform: scaleX(-1); transform-box: fill-box; transform-origin: center; }
  .fighter svg { display: block; width: 100%; height: auto; overflow: visible; }

  .corner.left.attack .mover { transform: translateX(28%) rotate(8deg); }
  .corner.right.attack .mover { transform: translateX(-28%) rotate(-8deg); }
  .corner.hurt .mover { animation: shake .3s; }
  .corner.spin .bob { animation: spin .7s ease-in-out; }

  /* barvy postavy podle role */
  .corner.good { --body: var(--good); --body-deep: var(--good-deep); --skin: var(--good-skin); }
  .corner.evil { --body: var(--evil); --body-deep: var(--evil-deep); --skin: var(--evil-skin); }
  .corner.good .evil-only, .corner.evil .good-only { display: none; }
  .body-fill { fill: var(--body); transition: fill .3s; }
  .deep-fill { fill: var(--body-deep); transition: fill .3s; }
  .skin-fill { fill: var(--skin); transition: fill .3s; }
  .deep-stroke { stroke: var(--body-deep); transition: stroke .3s; }

  .boom {
    position: absolute; left: 50%; top: 42%;
    transform: translate(-50%, -50%) scale(0);
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 7vw, 3rem);
    color: #241a4d;
    pointer-events: none;
    z-index: 3;
  }
  .boom span {
    display: inline-block; padding: 10px 18px;
    background: var(--ink);
    clip-path: polygon(50% 0, 61% 22%, 86% 8%, 80% 36%, 100% 50%, 80% 64%, 88% 92%, 61% 78%, 50% 100%, 39% 78%, 12% 92%, 20% 64%, 0 50%, 20% 36%, 14% 8%, 39% 22%);
    padding: 26px 30px;
  }
  .boom.show { animation: boom .45s ease-out; }

  .sparkle { position: absolute; pointer-events: none; font-size: 1.6rem; z-index: 4; animation: fly .9s ease-out forwards; }

  .hint {
    margin: 4px 0 0;
    font-family: var(--font-display);
    font-size: clamp(1.1rem, 4.6vw, 1.5rem);
    color: var(--ink);
  }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .chip {
    font-weight: 800; font-size: .95rem; color: var(--muted);
    background: rgba(255,255,255,.08); border-radius: 999px; padding: 6px 14px;
    font-variant-numeric: tabular-nums;
  }
  .chip strong { color: var(--ink); }
  .sound {
    appearance: none; border: 2px solid var(--muted); background: transparent; color: var(--ink);
    font: 800 .95rem var(--font-body); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .sound:focus-visible { outline: 3px solid var(--good); outline-offset: 3px; }
  .fact { margin: 6px 0 0; color: var(--muted); font-size: .95rem; max-width: 52ch; line-height: 1.5; }

  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6%); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6%); } 75% { transform: translateX(6%); } }
  @keyframes spin { 0% { transform: rotateY(0) scale(1); } 50% { transform: rotateY(180deg) scale(1.15); } 100% { transform: rotateY(360deg) scale(1); } }
  @keyframes boom { 0% { transform: translate(-50%,-50%) scale(0) rotate(-20deg); opacity: 1; } 60% { transform: translate(-50%,-50%) scale(1.1) rotate(4deg); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: 0; } }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.4) rotate(200deg); opacity: 0; } }
  @keyframes twinkle { 50% { opacity: .15; } }

  @media (prefers-reduced-motion: reduce) {
    .bob, .stars i { animation: none; }
    .corner.spin .bob, .corner.hurt .mover { animation: none; }
    .mover { transition: none; }
  }
</style>

<div class="wrap">
  <h1><span class="g">Hodný</span> vs. <span class="e">Zlý</span> dopamín</h1>
  <p class="sub">Klikni na kteréhokoli bojovníka a oba se promění!</p>

  <div class="arena" id="arena">
    <div class="stars" id="stars"></div>
    <div class="corner left good" id="left">
      <span class="tag" id="tagLeft">HODNÝ</span>
      <div class="hp"><b id="hpLeft"></b></div>
      <button class="fighter" type="button" id="btnLeft" aria-label="Levý bojovník — klikni pro proměnu"></button>
    </div>
    <div class="corner right evil" id="right">
      <span class="tag" id="tagRight">ZLÝ</span>
      <div class="hp"><b id="hpRight"></b></div>
      <button class="fighter" type="button" id="btnRight" aria-label="Pravý bojovník — klikni pro proměnu"></button>
    </div>
    <div class="boom" id="boom"><span id="boomText">BUM!</span></div>
  </div>

  <p class="hint">👆 Ťukni na dopamín!</p>
  <div class="stats">
    <span class="chip">Proměn: <strong id="swaps">0</strong></span>
    <span class="chip">Ran: <strong id="hits">0</strong></span>
    <button class="sound" type="button" id="sound">🔇 Zapnout zvuk</button>
  </div>
  <p class="fact">Dopamín je malá molekula v mozku. Má šestiúhelníkové tělíčko, dvě ručičky <b>OH</b> a ocásek <b>NH₂</b>. Pomáhá nám cítit radost, když se nám něco povede.</p>
</div>

<template id="fighterTpl">
  <svg viewBox="0 0 200 250" aria-hidden="true">
    <!-- stín -->
    <ellipse cx="100" cy="238" rx="62" ry="9" fill="rgba(0,0,0,.35)"/>
    <!-- nohy -->
    <rect x="70" y="190" width="20" height="44" rx="10" class="deep-fill"/>
    <rect x="110" y="190" width="20" height="44" rx="10" class="deep-fill"/>
    <ellipse cx="78" cy="234" rx="16" ry="8" class="deep-fill"/>
    <ellipse cx="122" cy="234" rx="16" ry="8" class="deep-fill"/>

    <!-- ocásek NH2 -->

    <circle cx="30" cy="210" r="15" fill="#5ab0ff" stroke="#fff" stroke-width="3"/>

    <path d="M60 120 L 30 96" stroke-width="10" stroke-linecap="round" class="deep-stroke"/>

    <!-- tělo = benzenový šestiúhelník -->
    <path d="M100 52 L160 86 L160 160 L100 194 L40 160 L40 86 Z" class="body-fill" stroke="#241a4d" stroke-width="6" stroke-linejoin="round"/>
    <path d="M100 70 L144 95 L144 151 L100 176 L56 151 L56 95 Z" class="skin-fill" opacity=".55"/>

    <!-- HODNÝ: svatozář -->
    <g class="good-only">
      <ellipse cx="100" cy="32" rx="34" ry="9" fill="none" stroke="#fff6a8" stroke-width="7"/>
      <ellipse cx="100" cy="32" rx="34" ry="9" fill="none" stroke="#ffd23f" stroke-width="3"/>
    </g>
    <!-- ZLÝ: růžky -->
    <g class="evil-only">
      <path d="M62 78 Q 48 46 62 30 Q 66 56 80 66 Z" fill="#e0234e" stroke="#241a4d" stroke-width="4" stroke-linejoin="round"/>
      <path d="M138 78 Q 152 46 138 30 Q 134 56 120 66 Z" fill="#e0234e" stroke="#241a4d" stroke-width="4" stroke-linejoin="round"/>

    <g class="good-only">
      <circle cx="80" cy="112" r="13" fill="#fff"/>

      <circle cx="83" cy="114" r="7" fill="#241a4d"/>

      <path d="M68 94 Q 80 86 92 94" fill="none" stroke="#241a4d" stroke-width="4" stroke-linecap="round"/>
      <path d="M108 94 Q 120 86 132 94" fill="none" stroke="#241a4d" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="66" cy="136" rx="9" ry="6" fill="#ff8fa3" opacity=".8"/>
      <ellipse cx="134" cy="136" rx="9" ry="6" fill="#ff8fa3" opacity=".8"/>

    <g class="good-only">
      <path d="M176 110 L 196 60" stroke="#fff6a8" stroke-width="6" stroke-linecap="round"/>
      <path d="M198 30 L205 46 L222 47 L209 58 L213 75 L198 66 L183 75 L187 58 L174 47 L191 46 Z" fill="#fff6a8" stroke="#f29f05" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <!-- zbraň ZLÝ: blesk -->
    <g class="evil-only">
      <path d="M186 30 L 168 74 L 184 74 L 170 116 L 214 62 L 194 62 L 208 30 Z" fill="#ffe04d" stroke="#241a4d" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <circle cx="174" cy="108" r="14" fill="#ff6b6b" stroke="#fff" stroke-width="3"/>
    <text class="lbl" x="174" y="113" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="800" font-size="12" fill="#fff">OH</text>
  </svg>
</template>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const tpl = $('fighterTpl');
  const sides = {
    left:  { el: $('left'),  btn: $('btnLeft'),  tag: $('tagLeft'),  hpEl: $('hpLeft'),  hp: 100, good: true },
    right: { el: $('right'), btn: $('btnRight'), tag: $('tagRight'), hpEl: $('hpRight'), hp: 100, good: false },
  };
  for (const s of Object.values(sides)) {
    const mover = document.createElement('span'); mover.className = 'mover';
    const bob = document.createElement('span'); bob.className = 'bob';
    const flip = document.createElement('span'); flip.className = 'flip';
    flip.appendChild(tpl.content.cloneNode(true));
    bob.appendChild(flip); mover.appendChild(bob); s.btn.appendChild(mover);
  }

  // hvězdičky na nebi
  const stars = $('stars');
  for (let i = 0; i < 28; i++) {
    const st = document.createElement('i');
    st.style.left = Math.random() * 100 + '%';
    st.style.top = Math.random() * 100 + '%';
    st.style.animationDelay = (Math.random() * 2.4) + 's';
    stars.appendChild(st);
  }

  // zvuk
  let audio = null, soundOn = false;
  const soundBtn = $('sound');
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    if (soundOn && !audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
    soundBtn.textContent = soundOn ? '🔊 Vypnout zvuk' : '🔇 Zapnout zvuk';
  });
  function tone(freq, dur, type = 'square', vol = 0.08, slide = 0) {
    if (!soundOn || !audio) return;
    const t = audio.currentTime;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  }

  function render() {
    for (const s of Object.values(sides)) {
      s.el.classList.toggle('good', s.good);
      s.el.classList.toggle('evil', !s.good);
      s.tag.textContent = s.good ? 'HODNÝ' : 'ZLÝ';
      s.hpEl.style.width = s.hp + '%';
    }
  }
  render();

  // boj
  const words = ['BUM!', 'PRÁSK!', 'ŠVIH!', 'BAC!', 'KABOOM!', 'ŽUCH!'];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let turn = 'left', hits = 0, busy = false;
  const boom = $('boom'), boomText = $('boomText');

  function attack() {
    if (busy) return;
    const a = sides[turn], d = sides[turn === 'left' ? 'right' : 'left'];
    a.el.classList.add('attack');
    setTimeout(() => {
      boomText.textContent = words[Math.floor(Math.random() * words.length)];
      boom.classList.remove('show'); void boom.offsetWidth; boom.classList.add('show');
      d.el.classList.remove('hurt'); void d.el.offsetWidth; d.el.classList.add('hurt');
      d.hp -= 8 + Math.floor(Math.random() * 10);
      if (d.hp <= 5) { sides.left.hp = 100; sides.right.hp = 100; }
      hits++; $('hits').textContent = hits;
      tone(a.good ? 520 : 160, 0.15, a.good ? 'triangle' : 'sawtooth', 0.08, a.good ? 300 : -60);
      render();
    }, 180);
    setTimeout(() => a.el.classList.remove('attack'), 360);
    turn = turn === 'left' ? 'right' : 'left';
  }
  setInterval(attack, reduced ? 1600 : 950);

  // proměna
  let swaps = 0;
  function sparkles(x, y) {
    const arena = $('arena').getBoundingClientRect();
    const icons = ['✨', '⭐', '💫', '💥', '🌟'];
    for (let i = 0; i < 12; i++) {
      const sp = document.createElement('span');
      sp.className = 'sparkle';
      sp.textContent = icons[i % icons.length];
      sp.style.left = (x - arena.left) + 'px';
      sp.style.top = (y - arena.top) + 'px';
      const ang = (Math.PI * 2 * i) / 12, dist = 70 + Math.random() * 50;
      sp.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      sp.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      $('arena').appendChild(sp);
      setTimeout(() => sp.remove(), 950);
    }
  }
  function swap() {
    if (busy) return;
    busy = true;
    swaps++; $('swaps').textContent = swaps;
    for (const s of Object.values(sides)) {
      s.el.classList.remove('spin'); void s.el.offsetWidth; s.el.classList.add('spin');
      const b = s.btn.getBoundingClientRect();
      sparkles(b.left + b.width / 2, b.top + b.height / 2);
    }
    [660, 880, 1100, 1320].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'sine', 0.07), i * 70));
    setTimeout(() => {
      sides.left.good = !sides.left.good;
      sides.right.good = !sides.right.good;
      render();
    }, reduced ? 0 : 350);
    setTimeout(() => {
      for (const s of Object.values(sides)) s.el.classList.remove('spin');
      busy = false;
    }, reduced ? 100 : 720);
  }
  sides.left.btn.addEventListener('click', swap);
  sides.right.btn.addEventListener('click', swap);
})();
</script>
